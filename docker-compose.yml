version: "3.9"

services:
  # ===========================
  # DATABASE (Runs in all modes)
  # ===========================
  db:
    image: postgres:15
    container_name: ecommerce_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro


  # =============================================
  # BACKEND — DEVELOPMENT MODE (Hot Reload)
  # =============================================
  backend-dev:
    profiles: ["dev"]
    container_name: ecommerce_backend_dev
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    env_file: .env
    volumes:
      - ./backend/app:/app/app        # hot reload
      - ./backend/logs:/app/logs
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      - db
    restart: unless-stopped


  # =============================================
  # BACKEND — PRODUCTION MODE
  # =============================================
  backend-prod:
    profiles: ["prod"]
    container_name: ecommerce_backend_prod
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    env_file: .env.prod
    environment:
      DATABASE_URL: ${DATABASE_URL}
      CORS_ORIGINS: ${CORS_ORIGINS}
      APP_ENV: ${APP_ENV}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      - db
    restart: unless-stopped


  # =============================================
  # FRONTEND — DEVELOPMENT MODE (Hot Reload)
  # =============================================
  frontend-dev:
    profiles: ["dev"]
    container_name: ecommerce_frontend_dev
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    env_file:
      - ./frontend/.env
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend-dev
    restart: unless-stopped


  # =============================================
  # FRONTEND — PRODUCTION MODE
  # =============================================
  frontend-prod:
    profiles: ["prod"]
    container_name: ecommerce_frontend_prod
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    env_file:
      - ./frontend/.env.prod
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend-prod
    restart: unless-stopped


volumes:
  postgres_data:
